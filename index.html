<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ultima V Web</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <!-- Takes the room the rest of the page leaves; the screen is the largest 4:3 that fits in it. -->
      <div id="stage"><canvas id="screen" width="320" height="200"></canvas></div>
      <!-- Where a touch screen's keyboard types: the game reads what changes in it (main.js). -->
      <input id="type-here" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Type here" />
      <p id="type-hint" hidden>Tap the screen to type</p>
      <!-- The ring of directional commands around a square next to the party (main.js). -->
      <div id="ring" hidden></div>
      <section id="setup" hidden>
        <p>
          Ultima V needs the original game's files (DATA.OVL, the .16 pictures, the maps...).
          Choose the folder they are in, or a ZIP file of the game. They stay in your browser;
          nothing is uploaded.
        </p>
        <label class="button">
          Choose the Ultima V folder
          <input id="folder" type="file" webkitdirectory multiple hidden />
        </label>
        <label class="button">
          Or a ZIP of it
          <input id="zip" type="file" accept=".zip,application/zip" hidden />
        </label>
        <p id="status"></p>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
